[workspace]
resolver = "2"
members = [
    "crates/chipdoc-core",
    "crates/chipdoc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["anas.alshaer"]
repository = "https://github.com/anas11alshaer/chipdoc"
description = "Convert technical and embedded PDFs (datasheets, TRMs) into grep-ready Agent Documentation Bundles"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdfium-render = { version = "0.8", features = ["thread_safe", "image_025"] }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
